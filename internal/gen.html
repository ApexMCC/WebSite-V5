<!DOCTYPE html>
<html lang="en">
<head>

<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-G2MD4PXZ6R');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex MCC Email Signature Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
        }

        .description {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d5d9df;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #0066cc;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0052a3;
        }

        .preview {
            width: 100%;
            overflow-x: auto;
            padding: 30px;
            background: #000000;
            border: 1px solid #333;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 230px;
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }

        .success {
            display: none;
            margin-top: 10px;
            color: #16803c;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Apex MCC</h1>

        <p class="description">
            Generate an Apex MCC email signature.
        </p>

        <label>Full Name</label>
        <input
            id="name"
            placeholder="e.g. Jayesh Poudel"
            value="Jayesh Poudel"
        >

        <label>Job Title</label>
        <input
            id="title"
            placeholder="e.g. Director of Information Technology"
            value="Director of Information Technology"
        >

        <label>Email</label>
        <input
            id="email"
            placeholder="e.g. support@apexmcc.org"
            value="support@apexmcc.org"
        >

        <button onclick="copySignature()">
            Copy Signature HTML
        </button>

        <div id="success" class="success">
            ✓ Signature HTML copied!
        </div>

    </div>

    <div class="card">

        <h2>Preview</h2>

        <div class="preview">
            <div id="signature"></div>
        </div>

        <h2 style="margin-top:25px;">
            Generated HTML
        </h2>

        <textarea id="output" readonly></textarea>

    </div>

</div>

<script>

const APEX_LOGO = "https://raw.githubusercontent.com/ApexMCC/WebSite-V4/refs/heads/main/cdn/apex_icon.png";
const APEX_WEBSITE = "https://www.apexmcc.org";

function escapeHTML(value) {
    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function generateSignature() {
    const name = document.getElementById("name").value || "Your Name";
    const title = document.getElementById("title").value || "Job Title";
    const email = document.getElementById("email").value || "support@apexmcc.org";

    const signature = `
<table cellpadding="0" cellspacing="0" border="0" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; color: #f3f4f6; background-color: #000000; padding: 12px; line-height: 1.5;">
  <tr>
    <td style="padding-right: 14px; vertical-align: middle;">
      <img src="${APEX_LOGO}" alt="Apex MCC Logo" width="32" style="display: block; border-radius: 4px;">
    </td>
    <td style="border-left: 2px solid #22c55e; padding-left: 14px; vertical-align: middle;">
      <div style="font-weight: 600; font-size: 14px; color: #ffffff; margin-bottom: 1px;">${escapeHTML(name)}</div>
      <div style="color: #9ca3af; font-size: 12px; margin-bottom: 4px;">${escapeHTML(title)} &nbsp;&middot;&nbsp; Apex MCC</div>
      <div style="font-size: 12px; margin-bottom: 4px;">
        <a href="mailto:${escapeHTML(email)}" style="color: #f3f4f6; text-decoration: underline; text-decoration-color: #22c55e;">${escapeHTML(email)}</a>
        <span style="color: #4b5563;">&nbsp;&nbsp;&middot;&nbsp;&nbsp;</span>
        <a href="${APEX_WEBSITE}" target="_blank" style="color: #f3f4f6; text-decoration: underline; text-decoration-color: #22c55e;">apexmcc.org</a>
      </div>
      <div style="color: #9ca3af; font-size: 11px; letter-spacing: 0.2px;">People. Community. Opportunity.</div>
    </td>
  </tr>
</table>
`.trim();

    document.getElementById("signature").innerHTML = signature;
    document.getElementById("output").value = signature;
}

async function copySignature() {
    const html = document.getElementById("output").value;

    try {
        await navigator.clipboard.writeText(html);
    } catch (error) {
        const textarea = document.getElementById("output");
        textarea.select();
        document.execCommand("copy");
    }

    const success = document.getElementById("success");
    success.style.display = "block";

    setTimeout(() => {
        success.style.display = "none";
    }, 2500);
}

document.querySelectorAll("input").forEach(input => {
    input.addEventListener("input", generateSignature);
});

generateSignature();

</script>

</body>
</html>
